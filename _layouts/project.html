---
layout: default
---
<article class="project-detail">
  <a class="back-link" href="{{ '/' | relative_url }}#projects">&larr; 목록으로</a>

  <header class="project-detail__header">
    <p class="label">PROJECT</p>
    <h1>{{ page.title }}</h1>
    <p class="project-detail__meta">
      <span>{{ page.period }}</span>
      <span class="dot">·</span>
      <span>{{ page.role }}</span>
    </p>
    <ul class="tag-list">
      {% for tag in page.tags %}
      <li class="tag">{{ tag }}</li>
      {% endfor %}
    </ul>
  </header>

  <div class="project-detail__body">
    {{ content }}
  </div>
</article>
