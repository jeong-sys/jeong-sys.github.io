---
layout: default
---
<article class="project-detail">
  <a class="back-link" href="{{ '/' | relative_url }}#projects">&larr; 목록으로</a>

  <header class="project-detail__header">
    <p class="label">PROJECT</p>
    <span class="badge badge--{{ page.type }}">{% if page.type == "company" %}실무{% else %}개인·팀{% endif %}</span>
    <h1>{{ page.title }}</h1>
    <p class="project-detail__meta">
      <span>{{ page.period }}</span>
      <span class="dot">·</span>
      <span>{{ page.role }}</span>
    </p>
    <ul class="tag-list">
      {% for tag in page.tags %}
      <li class="tag">{{ tag }}</li>
      {% endfor %}
    </ul>
  </header>

  <div class="project-detail__body" id="project-body">
    {{ content }}
  </div>
</article>

<button class="back-to-top" id="back-to-top" type="button" aria-label="맨 위로 이동">&uarr;</button>
