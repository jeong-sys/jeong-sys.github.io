title: "허유정"
description: "Backend Developer Portfolio"

# 프로필 정보는 _data/profile.yml 에서 관리 (수정 시 서버 재시작 불필요)

markdown: kramdown
permalink: pretty

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
