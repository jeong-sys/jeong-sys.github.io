<section class="section section--skills reveal" id="skills">
  <div class="container">
    <p class="label">02 / SKILLS</p>
    <div class="skills__grid">
      {% for group in site.data.skills %}
      <div class="skills__group">
        <h3>{{ group.category }}</h3>
        <ul class="tag-list">
          {% for item in group.items %}
          <li class="tag">
            {% if item.icon %}<img class="tag__icon" src="{{ item.icon }}" alt="" loading="lazy">{% endif %}
            <span>{{ item.name }}</span>
          </li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
