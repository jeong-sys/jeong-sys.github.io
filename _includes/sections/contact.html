<section class="section section--contact reveal" id="contact">
  <div class="container">
    <p class="label">05 / CONTACT</p>
    <h2>필요한 순간에, 확실하게 답하겠습니다.</h2>
    <ul class="contact-list">
      {% if site.email %}
      <li><a href="mailto:{{ site.email }}">Email <span class="arrow">&rarr;</span></a></li>
      {% endif %}
      {% if site.github %}
      <li><a href="{{ site.github }}" target="_blank" rel="noopener">GitHub <span class="arrow">&rarr;</span></a></li>
      {% endif %}
      {% if site.linkedin %}
      <li><a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn <span class="arrow">&rarr;</span></a></li>
      {% endif %}
    </ul>
  </div>
</section>
